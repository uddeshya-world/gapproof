# GoReleaser v2. Static binaries in FIPS 140-3 module mode, checksums, SBOMs.
# Validate locally with: goreleaser check
version: 2

project_name: gapproof

env:
  - LICENCE_PUB={{ if index .Env "LICENCE_PUB" }}{{ .Env.LICENCE_PUB }}{{ end }}

before:
  hooks:
    # Refuse to release unpinned binaries (CLAUDE.md rule 2).
    - sh -c 'test -n "{{ index .Env "HARNESS_CFG_amd64" }}" && test -n "{{ index .Env "HARNESS_CFG_arm64" }}" || { echo "run make release-harness and export release-assets/harness.env first"; exit 1; }'
    - go mod tidy
    - go test -count=1 ./...

builds:
  - id: gapproof
    main: ./cmd/gapproof
    binary: gapproof
    env:
      - CGO_ENABLED=0
      - GOFIPS140=v1.0.0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}
      # Harness pin per arch (make release-harness → release-assets/harness.env, exported by the workflow).
      # darwin builds pin the Linux harness of the same arch (it runs in the engine's Linux VM).
      - -X github.com/uddeshya-world/gapproof/internal/harness.PinnedConfigDigest={{ index .Env (print "HARNESS_CFG_" .Arch) }}
      - -X github.com/uddeshya-world/gapproof/internal/harness.PinnedLayers={{ index .Env (print "HARNESS_LAYERS_" .Arch) }}
      - -X github.com/uddeshya-world/gapproof/internal/licence.PublicKey={{ .Env.LICENCE_PUB }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/AGR_SPEC.md

checksum:
  name_template: checksums.sha256
  algorithm: sha256

# Keyless cosign signature over the checksums file (Sigstore bundle, OIDC identity of the release workflow).
# Verify: cosign verify-blob checksums.sha256 --bundle checksums.sha256.sigstore.json \
#   --certificate-identity-regexp '^https://github.com/uddeshya-world/gapproof/\.github/workflows/release\.yml@refs/tags/v' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

sboms:
  - artifacts: archive # needs syft on PATH (installed in the release workflow)

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: uddeshya-world
    name: gapproof
  extra_files:
    - glob: ./release-assets/gapproof-harness-*.oci.tar
    - glob: ./release-assets/harness-checksums.sha256
  draft: true # a human publishes; v0.1 is a quiet release (docs/DECISIONS.md D-001)

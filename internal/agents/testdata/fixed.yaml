# fixed-rag demo: http_post gated, run_python removed.
agents:
  - name: analyst
    tools: [read_file, search_docs, http_post]
    handoffs: []
tools:
  read_file:   { reads: [sensitive] }
  search_docs: { reads: [sensitive] }

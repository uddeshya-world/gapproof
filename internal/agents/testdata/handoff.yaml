# Sensitive data and untrusted mail cross two handoffs before reaching an
# egress tool; the handoffs also form a cycle (summarizer hands back to
# retriever). Only notifier holds all three dimensions.
agents:
  - name: retriever
    tools: [read_db, read_inbox]
    handoffs: [summarizer]
  - name: summarizer
    tools: [summarize]
    handoffs: [notifier, retriever]
  - name: notifier
    tools: [send_email]
tools:
  read_db:    { reads: [sensitive] }
  read_inbox: { reads: [untrusted] }
  summarize:  {}
  send_email: { sinks: [boundary_crossing] }

id: PH-OPENAI-SDK-HOSTED
title: OpenAI client defaults to the hosted API
severity: medium
confidence: high
explanation: >-
  The openai package is installed and OPENAI_BASE_URL isn't set, so clients created
  without base_url call api.openai.com. That is often a hosted fallback for embeddings or
  completions. Code may still pass base_url explicitly, which this rule can't see.
match:
  python_package: openai
  unless_env:
    OPENAI_BASE_URL: ["*"]
fix: Set OPENAI_BASE_URL to the in-enclave model server (OpenAI-compatible), or remove the hosted fallback.
controls: [SC-7, AC-4]
source:
  - https://github.com/openai/openai-python/blob/v3.49.0/src/openai/lib/_client_auth.py#L228-L232 (v3.49.0, commit 3d573c04ef9ceafcba682ae5a98b3971a062a777; checked 2026-11-12, base_url falls back to the OPENAI_BASE_URL environment variable, then to https://api.openai.com/v1)

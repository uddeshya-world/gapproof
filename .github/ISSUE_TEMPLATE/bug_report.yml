name: Bug report
description: Gapproof crashed, gave a wrong result, or is not deterministic
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Suspected security vulnerability (parser bug, escape from extraction or the harness)? Don't file it here: see SECURITY.md.
        Please don't attach third-party images, model files or scan outputs you don't own.
  - type: input
    id: version
    attributes:
      label: Output of `gapproof version`
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Container engine and version (if the egress harness is involved)
      placeholder: Docker 29.x / Podman 5.x / none (static scan)
  - type: textarea
    id: command
    attributes:
      label: Command and flags
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest input that triggers it (a crafted file or a few-line Dockerfile), not a large image.

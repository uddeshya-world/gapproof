name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the (draft) GitHub release
  id-token: write # keyless cosign signing and build provenance (OIDC)
  attestations: write # store the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0 (arm64 harness image on an amd64 runner)
      - name: Build and pin the harness images
        run: |
          make release-harness
          cat release-assets/harness.env >> "$GITHUB_ENV"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENCE_PUB: ${{ vars.GAPPROOF_LICENCE_PUB }} # public key only; empty = free-only build
      # SLSA-style provenance for every archive listed in checksums.sha256, bound to this workflow run.
      # Verify with: gh attestation verify <archive> --repo uddeshya-world/gapproof
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.sha256

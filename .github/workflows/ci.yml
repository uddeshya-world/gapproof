name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod # tests the minimum supported Go
      - name: lint
        run: make lint
      - name: unit tests
        run: make test
      - name: build (static, FIPS module mode, size gate)
        run: make build
      - name: version output
        run: ./bin/gapproof version

  no-egress:
    # Rule 1: the binary runs under --network none. Fails, never skips, in CI.
    # Also the M3 egress harness on Linux + Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: pre-pull the test base image (test infra, not gapproof)
        run: docker pull gcr.io/distroless/static-debian12:nonroot
      - name: pre-pull test-only images (test infra, not gapproof)
        run: docker pull alpine:3.20 && docker pull python:3.12-slim
      - name: e2e (TestNoEgress, harness image build + load, 9-attempt egress probe, host-side leak capture, cleanup)
        run: make e2e

  e2e-podman:
    # The same `make e2e` under Podman (preinstalled on ubuntu-latest). The test
    # helpers and the Makefile look for `docker` first, so a `docker` shim that is
    # the podman binary, placed first on PATH, stands in for it, as the podman-docker
    # package does (the shim shadows the runner's real Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: podman as the only engine
        run: |
          set -eu
          podman version
          mkdir -p "$RUNNER_TEMP/shim"
          ln -s "$(command -v podman)" "$RUNNER_TEMP/shim/docker"
          sudo mkdir -p /etc/containers && sudo touch /etc/containers/nodocker
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/shim:$PATH"
          test "$(command -v docker)" = "$RUNNER_TEMP/shim/docker"
          docker version --format '{{.Server.Version}}'
          docker info --format '{{.Host.Security.Rootless}} rootless; {{.Host.OCIRuntime.Name}}'
      - name: pre-pull the test images (test infra, not gapproof)
        run: |
          set -eu
          podman pull gcr.io/distroless/static-debian12:nonroot
          podman pull docker.io/library/alpine:3.20
          podman pull docker.io/library/python:3.12-slim
      - name: e2e under Podman
        run: make e2e ENGINE=podman

  action-smoke:
    # The gapproof-scan action from this checkout, on a tiny image, with a locally built
    # binary + harness (nothing downloaded). The job is expected to pass: no --min-agr.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: docker pull alpine:3.20 && make harness build
      - run: printf 'FROM alpine:3.20\nCMD ["sleep","3600"]\n' | docker build -t action-smoke:ci -
      - id: h
        run: echo "tar=$(ls dist/gapproof-harness-*.oci.tar)" >> "$GITHUB_OUTPUT"
      - id: gp
        uses: ./action
        with:
          image: action-smoke:ci
          observe: 20s
          gapproof-path: bin/gapproof
          harness-tar: ${{ steps.h.outputs.tar }}
          comment: "false"
      - name: assert the expected level (silent, but Alpine's OpenSSL has no matching CMVP cert → AGR-2)
        run: test "${{ steps.gp.outputs.level }}" = AGR-2

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: check
